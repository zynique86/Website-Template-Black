<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>商品详情 · ÉLAN 逸岚</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="container" style="padding-top:40px"><nav class="breadcrumb" aria-label="面包屑" style="margin:0"><a href="index.html">首页</a><span>/</span><a href="collection.html">臻选系列</a><span>/</span><em id="crumbName" style="font-style:normal">商品详情</em></nav></div>
    <section class="tight" style="padding-top:60px">
      <div class="container pdp" id="pdp"></div>
    </section>
    <div class="container"><nav class="pd-tabs" aria-label="商品介绍">
      <a href="#d-story">香氛故事</a><a href="#d-notes">香调层次</a><a href="#d-profile">产品参数</a><a href="#d-ritual">使用方式</a><a href="#d-reviews">买家评价</a>
    </nav></div>
    <section class="pd-sec" id="d-story"><div class="container pd-story" id="pdStory"></div></section>
    <section class="pd-sec" id="d-notes"><div class="container">
      <div class="pd-head"><span class="eyebrow">The Composition</span><h2 class="section-title">香调<em>层次</em></h2><div class="divider-gem"><span></span></div></div>
      <div class="pd-layers" id="pdLayers"></div>
    </div></section>
    <section class="pd-sec" id="d-profile"><div class="container pd-profile">
      <div><span class="eyebrow">Character</span><h2 class="section-title">气味<em>性格</em></h2><div class="meters" id="pdMeters"></div></div>
      <div><span class="eyebrow">Details</span><h2 class="section-title">产品<em>参数</em></h2><dl class="spec-table" id="pdSpecs"></dl></div>
    </div></section>
    <section class="pd-sec" id="d-ritual"><div class="container">
      <div class="pd-head"><span class="eyebrow">The Ritual</span><h2 class="section-title">使用<em>方式</em></h2><div class="divider-gem"><span></span></div></div>
      <ol class="steps steps-3" id="pdRitual"></ol>
    </div></section>
    <section class="pd-sec" id="d-reviews"><div class="container">
      <div class="pd-head"><span class="eyebrow">Reviews</span><h2 class="section-title">买家<em>评价</em></h2><div class="divider-gem"><span></span></div></div>
      <div class="pd-reviews" id="pdReviews"></div>
      <div class="more-link"><a class="text-link" href="reviews.html">查看全部评价 →</a></div>
    </div></section>
    <section style="padding-top:0">
      <div class="container">
        <div class="divider-ornate" aria-hidden="true"><svg><use href="#flourish"/></svg></div>
        <div class="section-head" style="margin-bottom:50px"><div><span class="eyebrow">You May Also Like</span><h2 class="section-title">你可能<em>还喜欢</em></h2></div></div>
        <div class="products" id="related"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/core.js"></script>
  <script src="assets/details.js"></script>
  <script>
    const p = findProduct(qs("id")) || PRODUCTS[0];
    document.title = `${p.name} · ÉLAN 逸岚`;
    document.getElementById("crumbName").textContent = p.name;
    let qty = 1;
    const pdp = document.getElementById("pdp");
    pdp.innerHTML = `
      <div class="pdp-media" style="--glow:${p.c1}40">${bottle(p.shape, p.c1, p.c2)}</div>
      <div class="pdp-info">
        <div class="cat">${p.catLabel}${p.tag ? " · " + p.tag : ""}</div>
        <h1>${p.name}</h1>
        <div class="en">${p.en}</div>
        <div class="pdp-meta"><span class="stars">★★★★★</span><span>${p.rating.toFixed(1)} 分</span><span>${p.reviews.toLocaleString("zh-CN")} 条评价</span><span>${p.size}</span></div>
        <div class="price">${fmt(p.price)}${p.was ? `<s>${fmt(p.was)}</s>` : ""}</div>
        <p class="story">${p.story}</p>
        <dl class="notes">
          <div><dt>前调</dt><dd>${p.notes[0]}</dd></div>
          <div><dt>中调</dt><dd>${p.notes[1]}</dd></div>
          <div><dt>后调</dt><dd>${p.notes[2]}</dd></div>
        </dl>
        <div class="buy-row">
          <div class="qty"><button id="minus" aria-label="减少">−</button><span id="qty">1</span><button id="plus" aria-label="增加">+</button></div>
          <button class="btn btn-ghost" id="addBtn" data-add="${p.id}" data-qty="1">加入购物袋</button>
          <a class="btn btn-primary" href="cart.html" id="buyNow">立即购买 <span class="arrow">→</span></a>
        </div>
        <ul class="assure"><li>满 ¥1,000 顺丰包邮，48 小时内发货</li><li>免费礼盒包装与手写贺卡</li><li>未拆封商品 30 天无忧退换</li></ul>
      </div>`;
    const setQty = (n) => { qty = Math.max(1, Math.min(9, n)); document.getElementById("qty").textContent = qty; document.getElementById("addBtn").dataset.qty = qty; };
    document.getElementById("minus").onclick = () => setQty(qty - 1);
    document.getElementById("plus").onclick = () => setQty(qty + 1);
    document.getElementById("buyNow").addEventListener("click", () => Cart.add(p.id, qty));
    const d = DETAILS[p.id];
    if (d) {
      const names = STAGE_NAME[p.cat], times = STAGE_TIME[p.cat];
      document.getElementById("pdStory").innerHTML = `
        <div class="pd-quote"><span class="eyebrow">The Story</span><blockquote>${d.headline}</blockquote><div class="pd-sign">${d.perfumer}</div></div>
        <div class="pd-text">${d.story.map((t) => `<p>${t}</p>`).join("")}</div>`;
      document.getElementById("pdLayers").innerHTML = d.layers.map((t, k) => `
        <article class="pd-layer"><span class="no">0${k + 1}</span><div class="when">${times[k]}</div><h3>${names[k]}</h3><div class="ing">${p.notes[k]}</div><p>${t}</p></article>`).join("");
      document.getElementById("pdMeters").innerHTML = Object.entries(d.profile).map(([k, v]) => `
        <div class="meter"><span>${k}</span><div class="bar"><i style="width:${v * 20}%"></i></div><b>${v}/5</b></div>`).join("");
      document.getElementById("pdSpecs").innerHTML = d.specs.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("");
      document.getElementById("pdRitual").innerHTML = RITUAL[p.cat].map(([h, t]) => `<li><h4>${h}</h4><p>${t}</p></li>`).join("");
      document.getElementById("pdReviews").innerHTML = d.reviews.map(([n, c, t]) => `
        <blockquote class="quote"><div class="meta"><span class="stars">★★★★★</span><span class="verified">已验证购买</span></div><p>${t}</p><footer><div><strong>${n}</strong><span>${c}</span></div></footer></blockquote>`).join("");
    }
    const related = PRODUCTS.filter((x) => x.id !== p.id && x.cat === p.cat).concat(PRODUCTS.filter((x) => x.cat !== p.cat)).slice(0, 4);
    document.getElementById("related").innerHTML = related.map(productCard).join("");
  </script>
</body>
</html>
